server:
  host: "0.0.0.0"
  port: 8080
  name: "journalist-mcp (local)"
  base_url: "http://localhost:8080"
  rate_limit_rps: 50
  rate_limit_burst: 100

execution:
  default_timeout: "300s"
  working_dir: "/tmp/journalist-mcp"
  max_concurrency: 10
  tools_dir: "/home/amphora/Proyectos/journalist-mcp/tools"
  tools_discovery: "manifest"
  tools_append: true
  environment:
    BASE_URL: "http://localhost:8080"
    SEARXNG_URL: "http://localhost:8080"
    PYTHONUNBUFFERED: "1"
