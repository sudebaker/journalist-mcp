name: datosgob_fetch
description: "Fetch datasets from datos.gob.es — portal de datos abiertos del Gobierno de España"
command: python3
args:
  - main.py
timeout: 120s
input_schema:
  type: object
  properties:
    query:
      type: string
      description: "Texto a buscar en título / descripción / keywords / editor. Vacío = primer página del catálogo."
      default: ""
    rows:
      type: integer
      description: "Máximo de datasets a devolver (1-100, default 50)."
      default: 50
  required: []
