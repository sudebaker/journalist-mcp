name: bdns_fetch
description: "Busca ayudas, subvenciones, concesiones, planes estratégicos, minimis y sanciones en BDNS (Base de Datos Nacional de Subvenciones). Agrega resultados de las 5 categorías."
command: python3
args:
  - main.py
timeout: 300s
input_schema:
  type: object
  properties:
    date:
      type: string
      description: "Fecha específica (YYYY-MM-DD). Si no se especifica, usa hoy."
    from:
      type: string
      description: "Inicio de rango histórico (YYYY-MM-DD). Requiere 'to'."
    to:
      type: string
      description: "Fin de rango histórico (YYYY-MM-DD). Requiere 'from'."
