name: searxng_search
description: "Búsqueda web con SearXNG local privado. Sin API key, sin rastreo. Agrega Google, Bing, DDG y Wikipedia."
command: python3
args:
  - main.py
timeout: 30s
input_schema:
  type: object
  properties:
    query:
      type: string
      description: "Término de búsqueda"
    count:
      type: integer
      default: 10
      description: "Número de resultados (máx 20, default 10)"
    language:
      type: string
      default: es-ES
      description: "Idioma/locale para resultados (ej. es-ES, en-US)"
    categories:
      type: string
      description: "Categorías separadas por coma: general, news, images, science, it, map (default: general)"
    time_range:
      type: string
      enum:
        - day
        - week
        - month
        - year
      description: "Filtrar resultados por rango temporal (opcional)"
  required:
    - query
