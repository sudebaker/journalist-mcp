name: ckan_fetch
description: "Busca datasets en portales CKAN de datos abiertos (Madrid, Barcelona, Euskadi). Permite filtrar por tags de interés (contratacion, subvenciones, presupuestos)."
command: python3
args:
  - main.py
timeout: 120s
input_schema:
  type: object
  properties:
    query:
      type: string
      description: "Texto libre de búsqueda (CKAN package_search `q`)."
    tags:
      type: array
      items:
        type: string
      description: "Lista de tags CKAN a filtrar (OR). Default: contratacion, subvenciones, presupuestos."
    portal:
      type: string
      description: "Portal CKAN a consultar: 'madrid', 'barcelona', 'euskadi' o lista separada por comas. Default: los tres."
      enum:
        - madrid
        - barcelona
        - euskadi
    rows:
      type: integer
      default: 10
      description: "Máximo de resultados por portal (1-50)."
    timeout:
      type: integer
      default: 20
      description: "Timeout en segundos por portal (1-120)."
  required:
    - query
