name: contratacion_search
description: "Busca licitaciones y contratos en la Plataforma de Contratación del Sector Público (PLACSP) por NIF/CIF de adjudicatario o nombre de entidad. Estrategia híbrida: feed ATOM CODICE en vivo para rangos <=90 días y descargas ZIP anuales para rangos mayores."
command: python3
args:
  - main.py
timeout: 300s
input_schema:
  type: object
  properties:
    target:
      type: string
      description: "NIF/CIF del adjudicatario u órgano, o nombre de empresa/entidad a buscar"
    target_type:
      type: string
      enum: [nif, cif, name]
      default: nif
      description: "Tipo de identificador"
    date_from:
      type: string
      description: "Inicio del rango (YYYY-MM-DD). Default: 30 días atrás."
    date_to:
      type: string
      description: "Fin del rango (YYYY-MM-DD). Default: hoy."
    count:
      type: integer
      default: 20
      description: "Número máximo de resultados a devolver (default 20)."
  required:
    - target
