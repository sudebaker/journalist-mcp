events {
    worker_connections 1024;
}

http {
    upstream mcp_server { server mcp-server:8080; }
    upstream searxng { server searxng:8080; }
    upstream crawl4ai { server crawl4ai:11235; }

    server {
        listen 80;

        location / {
            proxy_pass http://mcp_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location /searxng/ {
            proxy_pass http://searxng/;
            proxy_set_header Host $host;
        }

        location /crawl4ai/ {
            proxy_pass http://crawl4ai/;
            proxy_set_header Host $host;
        }
    }
}
