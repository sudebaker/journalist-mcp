# journalist-mcp — Stack completo
# Sustituye a mcp-go. Todos los servicios en un solo compose.
#
# Uso: cd deployments && docker compose up -d
# Perfiles: --profile ocu-investigacion (levanta Memgraph + OpenSearch)
#
# REDES DE SEGURIDAD:
#   internal  — Red aislada (internal: true). Servicios de datos sin acceso a internet.
#   external  — Red con acceso a internet. Servicios públicos/proxy.
#   journalist-mcp es el único puente entre ambas.

services:

  # ═══════════════════════════════════════════════
  # JOURNALIST-MCP — Puente entre redes
  # ═══════════════════════════════════════════════
  journalist-mcp:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: journalist-mcp
    ports:
      - "8080:8080"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:-postgresql://mcp:mcppassword@postgres:5432/knowledge}
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-rustfs:9000}
      RUSTFS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_ACCESS_KEY:-rustfsadmin}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      CRAWL4AI_URL: ${CRAWL4AI_URL:-http://crawl4ai:11235}
      CRAWL4AI_TOKEN: ${CRAWL4AI_TOKEN:-}
      MEMGRAPH_URL: ${MEMGRAPH_URL:-bolt://memgraph:7687}
      MEMGRAPH_USERNAME: ${MEMGRAPH_USERNAME:-}
      MEMGRAPH_PASSWORD: ${MEMGRAPH_PASSWORD:-}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      WHISPER_URL: ${WHISPER_URL:-http://whisper:8000}
      MCP_TOOLSET: ${MCP_TOOLSET:-osint-es}
      PYTHONUNBUFFERED: "1"
    volumes:
      - journalist-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
      whisper:
        condition: service_started
      searxng:
        condition: service_healthy
      memgraph:
        condition: service_healthy
        required: false
      opensearch:
        condition: service_healthy
        required: false
    networks:
      - internal
      - external
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ═══════════════════════════════════════════════
  # SERVICIOS INTERNOS — Sin acceso a internet
  # ═══════════════════════════════════════════════

  postgres:
    image: pgvector/pgvector:pg16
    container_name: mcp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcppassword}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcp} -d ${POSTGRES_DB:-knowledge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: whisper
    environment:
      WHISPER_MODEL: Systran/faster-whisper-small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface
    volumes:
      - whisper-models:/root/.cache/huggingface
    networks:
      - internal
    command: ["/root/faster-whisper-server/.venv/bin/uvicorn", "--factory", "faster_whisper_server.main:create_app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - "9000:9000"
    environment:
      RUSTFS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_ACCESS_KEY:-rustfsadmin}
    volumes:
      - rustfs-data:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/minio/health/live | grep -qE '^(200|403)$'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: ocu-memgraph
    profiles:
      - ocu-investigacion
    restart: unless-stopped
    ports:
      - "7687:7687"
    volumes:
      - memgraph-data:/var/lib/memgraph
      - memgraph-logs:/var/log/memgraph
    environment:
      - MEMGRAPH_ORGANIZATION_NAME=OCu
    command:
      - "--bolt-port=7687"
      - "--log-level=TRACE"
      - "--also-log-to-stderr=true"
      - "--storage-properties-on-edges=true"
      - "--storage-snapshot-interval-sec=300"
      - "--storage-wal-enabled=true"
      - "--telemetry-enabled=false"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f memgraph || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: ocu-opensearch
    profiles:
      - ocu-investigacion
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    environment:
      - cluster.name=ocu-cluster
      - node.name=ocu-node-1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true
      - network.host=0.0.0.0
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ═══════════════════════════════════════════════
  # SERVICIOS EXTERNOS — Con acceso a internet
  # ═══════════════════════════════════════════════

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    ports:
      - "11235:11235"
    shm_size: "1gb"
    environment:
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_TOKEN:-crawl4ai-dev-token-abc123def456}"
    networks:
      - external
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    environment:
      - BASE_URL=http://searxng:8080
      - INSTANCE_NAME=SearXNG-MCP
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - external
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

# ═══════════════════════════════════════════════
# REDES DE SEGURIDAD
# ═══════════════════════════════════════════════
networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge

# ═══════════════════════════════════════════════
# VOLÚMENES PERSISTENTES
# ═══════════════════════════════════════════════
volumes:
  journalist-data:
    driver: local
  postgres-data:
    driver: local
  rustfs-data:
    driver: local
  whisper-models:
    driver: local
  memgraph-data:
    driver: local
  memgraph-logs:
    driver: local
  opensearch-data:
    driver: local